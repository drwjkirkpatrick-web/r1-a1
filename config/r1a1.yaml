# R1-A1 runtime configuration
# The brain talks to any OpenAI/Ollama-compatible endpoint — swap
# base_url/model to move between host boards without code changes.

brain:
  # Host board — determines recommended model defaults and inference backend.
  # Options:
  #   ubuntu_x86  – Minisforum/Beelink Strix Halo, Ubuntu + Ollama (default)
  #   mac_ultra   – Mac Studio M3 Ultra, MLX backend (512 GB unified memory)
  #   jetson      – NVIDIA Jetson AGX Orin 64 GB, CUDA + TensorRT-LLM
  host_type: "ubuntu_x86"

  base_url: "http://localhost:11434"
  model: "qwen2.5:3b"
  fallback_model: "gemma2:2b"
  vision_model: "moondream:latest"

  # Mac Studio M3 Ultra overrides (set host_type to mac_ultra to use these).
  # MLX backend serves Ollama-compatible API via mlx-vlm / mlx-lm server.
  mac_ultra:
    base_url: "http://localhost:8080"
    model: "llama-3.3-70b-instruct-4bit"
    fallback_model: "llama-3.2-3b-instruct"
    vision_model: "qwen2-vl-7b-instruct-mlx"
    inference_backend: "mlx"

  # NVIDIA Jetson AGX Orin overrides.
  jetson:
    base_url: "http://localhost:11434"
    model: "qwen2.5:7b"
    fallback_model: "qwen2.5:3b"
    vision_model: "moondream:latest"
    inference_backend: "ollama"

  # Remedy personality — optional Hermes remedy personality overlay.
  # When enabled, the agent's system prompt is prepended with a
  # temperament-specific directive from the 100-remedy database.
  # See: ~/.hermes/skills/remedy_personality_picker/
  personality:
    enabled: false
    remedy: "bryonia_alba"   # 100 remedies available

  # LLM keep-alive — warm-model management for the brain host.
  # Pings the active model on an interval so it stays resident in RAM
  # (cold 70B loads cause multi-second speech stalls), and auto-falls
  # back to the small model when the primary stops answering.
  keepalive:
    enabled: true
    ping_interval_s: 30
    ping_timeout_s: 3
    max_consecutive_failures: 2

  # Limbic system — optional Hermes affective state engine.
  # When enabled, the agent maintains persistent mood (VAD), neurochemistry,
  # drives, and expression style across turns. State is saved to disk.
  # See: ~/projects/limbic-hermes/
  limbic:
    enabled: false
    profile: "pulsatilla_pratensis"   # 52 remedy temperament profiles
    state_dir: "~/.hermes/limbic_state"
    intensity: 0.6         # 0.0–0.8, clinical cap at 0.8
    inject_into_prompt: true

interconnect:
  port: "/dev/ttyACM0"
  baud: 115200
  heartbeat_interval_s: 1.0
  # Resilience: retry transient send/recv faults before declaring the
  # link down (USB CDC on a rolling robot sees vibration dropouts).
  retry_count: 2
  retry_backoff_s: 0.05

# Hermes agent node — hidden Jetson Nano in the dome hosting the Hermes
# agent layer (personality routing, limbic state, prompt orchestration)
# as a networked peer. Offloading the agent loop keeps the main brain
# host's RAM/bandwidth dedicated to LLM inference.
hermes_node:
  enabled: true
  base_url: "http://127.0.0.1:9299"   # dome node over slip-ring GbE
  node_id: "dome-hermes-01"
  timeout_s: 5.0

# Subsystem watchdog — periodic liveness supervision of the MCU link
# and critical sensors, escalating to soft e-stop when they go silent.
watchdog:
  enabled: true
  max_missed_heartbeats: 3

# Brain memory persistence — facts and the last N turns survive restarts.
memory:
  persist_path: "~/.r1a1/memory.json"
  autosave: true

# Optional onboard comms stack — GPS receiver, cellular hotspot
# failover, and WiFi router. All three are optional hardware add-ons;
# the code degrades gracefully when any is absent.
comms:
  enabled: true
  gps:
    enabled: true        # u-blox NEO-M9N over USB/UART
    device: "/dev/ttyUSB1"
  cellular:
    enabled: true        # 4G/5G USB hotspot, WAN failover
    apn: "wholesale"     # carrier APN
  wifi:
    enabled: true        # onboard router — operator's local AP
    ssid: "r1a1-ops"
    failover_to_cellular: true

motion:
  track_width_m: 0.42
  wheel_diameter_m: 0.152
  estop_budget_ms: 100

thermal:
  throttle_c: 75
  shutdown_c: 85
  battery_stop_c: 50
  fan_count: 5

power:
  seek_charger_soc_pct: 20
  meters_per_soc_pct: 12

audio:
  sample_rate: 16000
  chirp_set: "classic"

dashboard:
  enabled: true
  host: "127.0.0.1"
  port: 9298
  refresh_interval_s: 2
  # When limbic is enabled, the dashboard shows the live affective state
  # (VAD vector, dominant affect, neurochemistry summary, allostatic load).
  # When personality is enabled, the active remedy is displayed with emoji.